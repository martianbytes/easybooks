{% extends "base.html" %}
{% load static %}
{% block content %}

<section class="auth-section">
  <div class="auth-card">

    <div class="auth-card__icon auth-card__icon--success">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <h1 class="auth-card__title">Password reset!</h1>
    <p class="auth-card__sub">Your password has been set successfully. You can now log in with your new password.</p>

    <a href="{% url 'accounts:login' %}" class="pdb-btn-primary auth-btn" style="display:inline-flex;justify-content:center;">
      Log in
    </a>

  </div>
</section>

{% endblock %}
