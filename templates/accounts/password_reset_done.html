{% extends "base.html" %}
{% load static %}
{% block content %}

<section class="auth-section">
  <div class="auth-card">

    <div class="auth-card__icon auth-card__icon--success">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
    </div>

    <h1 class="auth-card__title">Check your inbox</h1>
    <p class="auth-card__sub">If an account exists with that email, we've sent a password reset link. It may take a minute to arrive — check your spam folder too.</p>

    <a href="{% url 'accounts:login' %}" class="pdb-btn-primary auth-btn" style="display:inline-flex;justify-content:center;">
      Back to login
    </a>

    <p class="auth-card__footer">
      Didn't get it? <a href="{% url 'accounts:password_reset' %}">Try again</a>
    </p>

  </div>
</section>

{% endblock %}
