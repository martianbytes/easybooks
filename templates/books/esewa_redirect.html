<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to eSewa...</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .box {
      text-align: center;
      background: #fff;
      padding: 2.5rem 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #e0e0e0;
      border-top-color: #60bb46;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 1.2rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 .4rem; color: #222; font-size: 1.2rem; }
    p  { margin: 0; color: #666; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2>Redirecting to eSewa…</h2>
    <p>Please wait while we connect you to the payment gateway.</p>
  </div>

  <form id="esewa-form" method="POST" action="{{ esewa_url }}">
    <input type="hidden" name="amount"                   value="{{ amount }}" />
    <input type="hidden" name="tax_amount"               value="{{ tax_amount }}" />
    <input type="hidden" name="total_amount"             value="{{ total_amount }}" />
    <input type="hidden" name="transaction_uuid"         value="{{ transaction_uuid }}" />
    <input type="hidden" name="product_code"             value="{{ product_code }}" />
    <input type="hidden" name="product_service_charge"   value="{{ product_service_charge }}" />
    <input type="hidden" name="product_delivery_charge"  value="{{ product_delivery_charge }}" />
    <input type="hidden" name="success_url"              value="{{ success_url }}" />
    <input type="hidden" name="failure_url"              value="{{ failure_url }}" />
    <input type="hidden" name="signed_field_names"       value="{{ signed_field_names }}" />
    <input type="hidden" name="signature"                value="{{ signature }}" />
  </form>

  <script>
    document.getElementById('esewa-form').submit();
  </script>
</body>
</html>
